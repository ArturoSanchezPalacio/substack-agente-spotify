[project]
name = "agente-spotify"
version = "0.1.0"
description = "Agente de OpenAI para crear playlists en Spotify."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.4.0",
    "python-dotenv>=1.0.1",
    "spotipy>=2.24.0",
    "streamlit>=1.39.0",
]

[project.scripts]
spotify-agent = "spotify_playlist_agent.cli:main"
spotify-agent-ui = "spotify_playlist_agent.streamlit_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_playlist_agent"]
